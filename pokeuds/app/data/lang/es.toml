"A .pgf (204 bytes, the Gen 5 card), or a .bin or .wc5full (720 bytes, the same file under two names: the gift file the DS beacons carry). Its received date and checksum are put right before it is sent." = "Un .pgf (204 bytes, la tarjeta de la 5.ª generación), o un .bin o .wc5full (720 bytes, el mismo archivo con dos nombres: el archivo de regalo que llevan las balizas DS). Su fecha de recepción y su suma de comprobación se ajustan justo antes de enviarlo."
"A .pk8 copy for Sword and Shield, made as {value0} would move it, with its origin mark. This .{value1} stays in the bank as it is." = "Una copia .pk8 para Sword y Shield, hecha como la movería {value0}, con su símbolo de origen. Este .{value1} se queda en el banco tal cual."
"A .pk{value0} copy made as {value1} makes it. This .{value2} stays in the bank as it is; the copy can never come back to Generation {value3}." = "Una copia .pk{value0} hecha como la hace {value1}. Este .{value2} se queda tal cual en el banco; la copia nunca podrá volver a la {value3}.ª generación."
"A .wc{value0} (264 bytes, as PKHeX and the event galleries keep them) or a .wc{value1}full (784 bytes: the distribution header, then the card). The game above decides how it is read." = "Un .wc{value0} (264 bytes, como los guardan PKHeX y las galerías de eventos) o un .wc{value1}full (784 bytes: la cabecera de distribución y luego la tarjeta). El juego de arriba decide cómo se lee."
"A DS card gives one of the item." = "Una tarjeta de DS da una unidad del objeto."
"A Gen 5 card holds IVs but no EVs; the game works out the stats." = "Una tarjeta de la 5.ª generación tiene IV pero no EV; el juego calcula las estadísticas."
"A Pokemon Egg for you!" = "¡Un Huevo de Pokémon para ti!"
"A Pokemon traded from that trainer, as most official events give." = "Un Pokémon recibido en intercambio de ese Entrenador, como dan la mayoría de los eventos oficiales."
"A Virtual Console queue is all .pk1 or all .pk2: they trade in different rooms" = "Una cola de la Consola Virtual es toda .pk1 o toda .pk2: se intercambian en salas distintas"
"A card cannot hold stats: the game works them out from the species, level, nature, IVs and EVs. Set those here; Preview shows the stats the game will give it." = "Una tarjeta no puede guardar estadísticas: el juego las calcula a partir de la especie, el nivel, la naturaleza, los IV y los EV. Ajústalos aquí; la vista previa muestra las estadísticas que le dará el juego."
"A plugin runs as Python inside PokeUDS with full access to your files, console keys, the network and the radio. Install only plugins you trust; PokeUDS does not review them. The install screen says what the code does, and guardrails stop it deleting files outside its own folders, but they are not a sandbox." = "Un plugin se ejecuta como Python dentro de PokeUDS con acceso total a tus archivos, las claves de la consola, la red y la radio. Instala solo plugins de confianza; PokeUDS no los revisa. La pantalla de instalación dice lo que hace el código, y unas protecciones le impiden borrar archivos fuera de sus propias carpetas, pero no son un entorno aislado."
"A source is a published list of plugins (a pokeuds-source.json). Follow one by its GitHub OWNER/REPO or an https:// address; Browse lists what it offers." = "Una fuente es una lista publicada de plugins (un pokeuds-source.json). Síguela por su OWNER/REPO de GitHub o una dirección https://; Explorar muestra lo que ofrece."
