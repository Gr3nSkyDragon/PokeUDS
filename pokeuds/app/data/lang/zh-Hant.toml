"PokeUDS sends this card the way a store distribution did, in DS beacons on channel 7. On the DS: Mystery Gift, Receive Gift, then the wireless option (not Wi-Fi). Choose the cartridge's language: the game ignores a gift for another. Any number of DS consoles can take it while it runs." = "PokeUDS 像店頭配信那樣，在頻道 7 上用 DS 信標傳送這張卡片。在 DS 上：神秘禮物、接收禮物，然後選擇無線方式（不是 Wi-Fi）。請選擇卡匣的語言：遊戲會忽略其他語言的禮物。執行期間任意數量的 DS 都能領取。"
"PokeUDS sends this card the way a store or event distribution did. On the 3DS: Mystery Gift, Receive Gift, Get via Local Wireless. Any number of consoles can take it while it runs." = "PokeUDS 像店頭或活動配信那樣傳送這張卡片。在 3DS 上：神秘禮物、接收禮物、透過本地通訊接收。執行期間任意數量的主機都能領取。"
"PokeUDS signs the compressed message with the distributor's OPSSR key, as the real distributor does, so the game recovers and accepts it (docs/mystery_gift.md)." = "PokeUDS 與真正的配信工具一樣，用配信工具的 OPSSR 金鑰為壓縮後的訊息簽署，因此遊戲能還原並接受它（docs/mystery_gift.md）。"
