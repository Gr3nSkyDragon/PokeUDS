"On the 3DS, choose Join in the VC link menu once PokeUDS is waiting, then go to the Trade Center and sit at the table." = "PokeUDS 開始等待後，在 3DS 的 VC 通訊選單中選擇「加入」，然後去交換中心，坐到桌前。"
"On the 3DS, open the Festival Plaza with local wireless on. PokeUDS appears among the guests: invite it to a Link Trade. PokeUDS accepts." = "在 3DS 上開啟本地通訊並打開圓慶廣場。PokeUDS 會出現在訪客中：邀請它進行連線交換。PokeUDS 會接受。"
"On the 3DS, open the Festival Plaza with local wireless on. PokeUDS invites the first player it hears to a Link Trade: accept it on the 3DS." = "在 3DS 上開啟本地通訊並打開圓慶廣場。PokeUDS 會邀請它發現的第一位玩家進行連線交換：請在 3DS 上接受。"
"On the 3DS, open the PSS with local wireless on. PokeUDS asks the first trainer it hears for a trade: accept it on the 3DS." = "在 3DS 上開啟本地通訊並打開 PSS。PokeUDS 會向它發現的第一位訓練家請求交換：請在 3DS 上接受。"
"On the 3DS, open the PSS with local wireless on. PokeUDS trainer appears there: tap it and ask for a trade. PokeUDS answers and joins." = "在 3DS 上開啟本地通訊並打開 PSS。PokeUDS 訓練家會出現在那裡：點選它並請求交換。PokeUDS 會回應並加入。"
