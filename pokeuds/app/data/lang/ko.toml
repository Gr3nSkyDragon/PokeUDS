"A .pk8 copy for Sword and Shield, made as {value0} would move it, with its origin mark. This .{value1} stays in the bank as it is." = "Sword·Shield용 .pk8 사본입니다. {value0}가 옮기는 것과 같은 방식으로 만들며, 출신 마크도 남습니다. 이 .{value1}은(는) 그대로 뱅크에 남습니다."
