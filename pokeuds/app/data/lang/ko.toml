"PokeUDS picks a PID that is shiny for the card's OT, with the gender, nature and ability chosen here (Gen 4 works all of them out from the PID), so everyone gets that same Pokemon." = "PokeUDS는 카드의 어버이에게 색이 다른 포켓몬이 되는 PID를, 여기서 고른 성별, 성격, 특성으로 고릅니다 (4세대는 모두 PID로 정해집니다). 그래서 누구나 같은 포켓몬을 받습니다."
"PokeUDS sends this card the way a store distribution did, in DS beacons on channel 7. On the DS: Mystery Gift, Receive Gift, then the wireless option (not Wi-Fi). Choose the cartridge's language: the game ignores a gift for another. Any number of DS consoles can take it while it runs." = "PokeUDS는 매장 배포처럼 채널 7의 DS 비컨으로 이 카드를 보냅니다. DS에서: 이상한소포, 선물을 받는다, 그다음 무선 통신(Wi-Fi가 아닌 쪽). 카트리지의 언어를 고르세요: 게임은 다른 언어의 선물을 무시합니다. 실행 중에는 DS 몇 대든 받을 수 있습니다."
"PokeUDS sends this card the way a store or event distribution did. On the 3DS: Mystery Gift, Receive Gift, Get via Local Wireless. Any number of consoles can take it while it runs." = "PokeUDS는 매장이나 이벤트 배포처럼 이 카드를 보냅니다. 3DS에서: 이상한소포, 선물을 받는다, 로컬 통신으로 받는다. 실행 중에는 몇 대든 받을 수 있습니다."
"PokeUDS signs the compressed message with the distributor's OPSSR key, as the real distributor does, so the game recovers and accepts it (docs/mystery_gift.md)." = "PokeUDS는 진짜 배포 도구처럼 압축된 메시지에 배포 도구의 OPSSR 키로 서명하므로, 게임이 복원해서 받아들입니다 (docs/mystery_gift.md)."
