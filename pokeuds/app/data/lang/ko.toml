"A Virtual Console queue is all .pk1 or all .pk2: they trade in different rooms" = "버추얼 콘솔 대기열은 모두 .pk1이거나 모두 .pk2여야 합니다: 서로 다른 방에서 교환합니다"
"A card cannot hold stats: the game works them out from the species, level, nature, IVs and EVs. Set those here; Preview shows the stats the game will give it." = "카드에는 능력치를 담을 수 없습니다: 게임이 종류, 레벨, 성격, 개체값, 노력치로 계산합니다. 여기서 그것들을 설정하세요. 미리 보기에 게임이 줄 능력치가 표시됩니다."
