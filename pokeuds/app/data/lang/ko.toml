"A .wc{value0} (264 bytes, as PKHeX and the event galleries keep them) or a .wc{value1}full (784 bytes: the distribution header, then the card). The game above decides how it is read." = ".wc{value0}(264바이트, PKHeX와 이벤트 갤러리가 보관하는 형식) 또는 .wc{value1}full(784바이트: 배포 헤더와 카드). 읽는 방식은 위의 게임이 정합니다."
"A DS card gives one of the item." = "DS 카드는 그 도구를 1개 줍니다."
