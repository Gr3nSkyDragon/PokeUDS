"On the 3DS, choose Host in the VC link menu, then go to the Pokemon Center's Trade Center and sit at the table. PokeUDS joins." = "3DS の VC の通信メニューで「ホスト」を選び、ポケモンセンターのトレードセンターに行ってテーブルに座ってください。PokeUDS が参加します。"
"On the 3DS, choose Join in the VC link menu once PokeUDS is waiting, then go to the Trade Center (or the Time Capsule for a .pk1) and sit at the table." = "PokeUDS が待機したら、3DS の VC の通信メニューで「参加」を選び、トレードセンター（.pk1 ならタイムカプセル）に行ってテーブルに座ってください。"
"On the 3DS, choose Join in the VC link menu once PokeUDS is waiting, then go to the Trade Center and sit at the table." = "PokeUDS が待機したら、3DS の VC の通信メニューで「参加」を選び、トレードセンターに行ってテーブルに座ってください。"
"On the 3DS, open the Festival Plaza with local wireless on. PokeUDS appears among the guests: invite it to a Link Trade. PokeUDS accepts." = "3DS でローカル通信をオンにしてフェスサークルを開いてください。ゲストの中に PokeUDS が現れるので、通信交換に誘ってください。PokeUDS が受け入れます。"
"On the 3DS, open the Festival Plaza with local wireless on. PokeUDS invites the first player it hears to a Link Trade: accept it on the 3DS." = "3DS でローカル通信をオンにしてフェスサークルを開いてください。PokeUDS は最初に見つけたプレイヤーを通信交換に誘うので、3DS で受け入れてください。"
"On the 3DS, open the PSS with local wireless on. PokeUDS asks the first trainer it hears for a trade: accept it on the 3DS." = "3DS でローカル通信をオンにして PSS を開いてください。PokeUDS は最初に見つけたトレーナーに交換を申し込むので、3DS で受け入れてください。"
"On the 3DS, open the PSS with local wireless on. PokeUDS trainer appears there: tap it and ask for a trade. PokeUDS answers and joins." = "3DS でローカル通信をオンにして PSS を開いてください。PokeUDS のトレーナーが現れるので、タッチして交換を申し込んでください。PokeUDS が応じて参加します。"
