"PokeUDS downloads the new version, checks it, closes, replaces its own program files (PokeUDS.exe and _internal) and opens again. Your Bank (and your GTS listings in it), your settings in Data and the received folder are not touched." = "PokeUDS は新しいバージョンをダウンロードして確認し、いったん閉じてプログラムファイル（PokeUDS.exe と _internal）を置き換え、再び開きます。バンク（その中の GTS の出品も）、Data の設定、受け取りフォルダは変わりません。"
