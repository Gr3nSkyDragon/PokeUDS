"PokeUDS sends this card the way a store distribution did, in DS beacons on channel 7. On the DS: Mystery Gift, Receive Gift, then the wireless option (not Wi-Fi). Choose the cartridge's language: the game ignores a gift for another. Any number of DS consoles can take it while it runs." = "PokeUDS は店頭配信と同じように、チャンネル7の DS ビーコンでこのカードを送ります。DS で：ふしぎなおくりもの、おくりものを うけとる、ワイヤレス通信（Wi-Fi ではない方）。カートリッジの言語を選んでください：ほかの言語のおくりものは無視されます。送信中は何台の DS でも受け取れます。"
"PokeUDS sends this card the way a store or event distribution did. On the 3DS: Mystery Gift, Receive Gift, Get via Local Wireless. Any number of consoles can take it while it runs." = "PokeUDS は店頭やイベントの配信と同じようにこのカードを送ります。3DS で：ふしぎなおくりもの、おくりものを うけとる、ローカル通信で うけとる。送信中は何台でも受け取れます。"
"PokeUDS signs the compressed message with the distributor's OPSSR key, as the real distributor does, so the game recovers and accepts it (docs/mystery_gift.md)." = "PokeUDS は本物の配信ツールと同じく、圧縮したメッセージに配信ツールの OPSSR 鍵で署名するので、ゲームが復元して受け入れます（docs/mystery_gift.md）。"
