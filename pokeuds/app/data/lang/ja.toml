"A card cannot hold stats: the game works them out from the species, level, nature, IVs and EVs. Set those here; Preview shows the stats the game will give it." = "カードは能力値を持てません。ゲームが種類・レベル・せいかく・個体値・努力値から計算します。ここでそれらを設定してください。プレビューでゲームが与える能力値を確認できます。"
"A plugin runs as Python inside PokeUDS with full access to your files, console keys, the network and the radio. Install only plugins you trust; PokeUDS does not review them. The install screen says what the code does, and guardrails stop it deleting files outside its own folders, but they are not a sandbox." = "プラグインは PokeUDS の中で Python として動き、ファイル、本体の鍵、ネットワーク、無線にすべてアクセスできます。信頼できるプラグインだけを入れてください。PokeUDS はプラグインを審査しません。インストール画面にコードの動作が表示され、自分のフォルダ以外のファイルを消せないよう制限していますが、サンドボックスではありません。"
