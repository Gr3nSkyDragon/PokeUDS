"A .pk8 copy for Sword and Shield, made as {value0} would move it, with its origin mark. This .{value1} stays in the bank as it is." = "Sword・Shield 用の .pk8 コピーです。{value0} が移すのと同じように作り、出身マークも残ります。この .{value1} はそのままバンクに残ります。"
"A .pk{value0} copy made as {value1} makes it. This .{value2} stays in the bank as it is; the copy can never come back to Generation {value3}." = "{value1} が作るのと同じ方法で作った .pk{value0} のコピーです。この .{value2} はそのままバンクに残ります。コピーが第{value3}世代に戻ることはありません。"
"A .wc{value0} (264 bytes, as PKHeX and the event galleries keep them) or a .wc{value1}full (784 bytes: the distribution header, then the card). The game above decides how it is read." = ".wc{value0}（264 バイト、PKHeX やイベント配布の一覧と同じ形）または .wc{value1}full（784 バイト：配信ヘッダーとカード）。読み方は上のゲームで決まります。"
"A DS card gives one of the item." = "DS のカードはそのどうぐを1つくれます。"
"A Gen 5 card holds IVs but no EVs; the game works out the stats." = "第5世代のカードは個体値を持ちますが努力値は持ちません。能力値はゲームが計算します。"
