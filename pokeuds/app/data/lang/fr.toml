"PokeUDS sends this card the way a store distribution did, in DS beacons on channel 7. On the DS: Mystery Gift, Receive Gift, then the wireless option (not Wi-Fi). Choose the cartridge's language: the game ignores a gift for another. Any number of DS consoles can take it while it runs." = "PokeUDS envoie cette carte comme le faisait une distribution en magasin, dans des balises DS sur le canal 7. Sur la DS : Cadeau Mystère, Recevoir un cadeau, puis l'option sans fil (pas Wi-Fi). Choisissez la langue de la cartouche : le jeu ignore un cadeau destiné à une autre. Autant de consoles DS que vous voulez peuvent le recevoir pendant qu'il tourne."
"PokeUDS sends this card the way a store or event distribution did. On the 3DS: Mystery Gift, Receive Gift, Get via Local Wireless. Any number of consoles can take it while it runs." = "PokeUDS envoie cette carte comme le faisait une distribution en magasin ou lors d'un évènement. Sur la 3DS : Cadeau Mystère, Recevoir un cadeau, Recevoir via la communication locale. Autant de consoles que vous voulez peuvent le recevoir pendant qu'il tourne."
"PokeUDS signs the compressed message with the distributor's OPSSR key, as the real distributor does, so the game recovers and accepts it (docs/mystery_gift.md)." = "PokeUDS signe le message compressé avec la clé OPSSR du distributeur, comme le fait le vrai distributeur, si bien que le jeu le récupère et l'accepte (docs/mystery_gift.md)."
