"A .pcd or .wc4 (856 bytes, the Gen 4 card; a .wc4 may keep its Pokemon unencrypted), or a .myg (936 bytes: the gift file the DS beacons carry)." = "Un .pcd ou un .wc4 (856 octets, la carte de la 4e génération ; un .wc4 peut garder son Pokémon non chiffré), ou un .myg (936 octets : le fichier cadeau que portent les balises DS)."
"A .pgf (204 bytes, the Gen 5 card), or a .bin or .wc5full (720 bytes, the same file under two names: the gift file the DS beacons carry). Its received date and checksum are put right before it is sent." = "Un .pgf (204 octets, la carte de la 5e génération), ou un .bin ou .wc5full (720 octets, le même fichier sous deux noms : le fichier cadeau que portent les balises DS). Sa date de réception et sa somme de contrôle sont corrigées juste avant l'envoi."
"A .pk8 copy for Sword and Shield, made as {value0} would move it, with its origin mark. This .{value1} stays in the bank as it is." = "Une copie .pk8 pour Sword et Shield, faite comme {value0} la déplacerait, avec son symbole d'origine. Ce .{value1} reste dans la banque tel quel."
"A .pk{value0} copy made as {value1} makes it. This .{value2} stays in the bank as it is; the copy can never come back to Generation {value3}." = "Une copie .pk{value0} faite comme le fait {value1}. Ce .{value2} reste tel quel dans la banque ; la copie ne pourra jamais revenir en {value3}e génération."
"A .wc{value0} (264 bytes, as PKHeX and the event galleries keep them) or a .wc{value1}full (784 bytes: the distribution header, then the card). The game above decides how it is read." = "Un .wc{value0} (264 octets, comme PKHeX et les galeries d'évènements les gardent) ou un .wc{value1}full (784 octets : l'en-tête de distribution, puis la carte). Le jeu ci-dessus décide comment il est lu."
"A DS card gives one of the item." = "Une carte DS donne un exemplaire de l'objet."
"A Gen 5 card holds IVs but no EVs; the game works out the stats." = "Une carte de la 5e génération contient des IV mais pas d'EV ; le jeu calcule les statistiques."
"A Pokemon Egg for you!" = "Un Œuf de Pokémon pour vous !"
"A Pokemon traded from that trainer, as most official events give." = "Un Pokémon échangé par ce Dresseur, comme la plupart des évènements officiels."
"A Virtual Console queue is all .pk1 or all .pk2: they trade in different rooms" = "Une file Console Virtuelle ne contient que des .pk1 ou que des .pk2 : ils s'échangent dans des salles différentes"
"A card cannot hold stats: the game works them out from the species, level, nature, IVs and EVs. Set those here; Preview shows the stats the game will give it." = "Une carte ne peut pas contenir de statistiques : le jeu les calcule à partir de l'espèce, du niveau, de la nature, des IV et des EV. Réglez-les ici ; l'aperçu montre les statistiques que le jeu lui donnera."
"A plugin runs as Python inside PokeUDS with full access to your files, console keys, the network and the radio. Install only plugins you trust; PokeUDS does not review them. The install screen says what the code does, and guardrails stop it deleting files outside its own folders, but they are not a sandbox." = "Un plugin s'exécute en Python dans PokeUDS avec un accès complet à vos fichiers, aux clés de la console, au réseau et à la radio. N'installez que des plugins de confiance ; PokeUDS ne les vérifie pas. L'écran d'installation indique ce que fait le code, et des garde-fous l'empêchent de supprimer des fichiers hors de ses propres dossiers, mais ce n'est pas un bac à sable."
"A source is a published list of plugins (a pokeuds-source.json). Follow one by its GitHub OWNER/REPO or an https:// address; Browse lists what it offers." = "Une source est une liste publiée de plugins (un pokeuds-source.json). Suivez-en une par son OWNER/REPO GitHub ou une adresse https:// ; Parcourir liste ce qu'elle propose."
