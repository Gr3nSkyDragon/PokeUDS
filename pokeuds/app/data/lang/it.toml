": the queue holds {value0}" = ": la coda contiene {value0}"
"A .pcd or .wc4 (856 bytes, the Gen 4 card; a .wc4 may keep its Pokemon unencrypted), or a .myg (936 bytes: the gift file the DS beacons carry)." = "Un .pcd o un .wc4 (856 byte, la carta della 4ª generazione; un .wc4 può tenere il suo Pokémon non cifrato), oppure un .myg (936 byte: il file dono che portano i beacon DS)."
"A .pgf (204 bytes, the Gen 5 card), or a .bin or .wc5full (720 bytes, the same file under two names: the gift file the DS beacons carry). Its received date and checksum are put right before it is sent." = "Un .pgf (204 byte, la carta della 5ª generazione), oppure un .bin o .wc5full (720 byte, lo stesso file con due nomi: il file dono che portano i beacon DS). La data di ricezione e il checksum vengono sistemati subito prima dell'invio."
"A .pk8 copy for Sword and Shield, made as {value0} would move it, with its origin mark. This .{value1} stays in the bank as it is." = "Una copia .pk8 per Sword e Shield, fatta come la trasferirebbe {value0}, con il suo simbolo d'origine. Questo .{value1} resta nella banca così com'è."
"A .pk{value0} copy made as {value1} makes it. This .{value2} stays in the bank as it is; the copy can never come back to Generation {value3}." = "Una copia .pk{value0} fatta come la fa {value1}. Questo .{value2} resta com'è nella banca; la copia non potrà mai tornare alla {value3}ª generazione."
"A .wc{value0} (264 bytes, as PKHeX and the event galleries keep them) or a .wc{value1}full (784 bytes: the distribution header, then the card). The game above decides how it is read." = "Un .wc{value0} (264 byte, come li tengono PKHeX e le gallerie degli eventi) oppure un .wc{value1}full (784 byte: l'intestazione di distribuzione, poi la carta). Il gioco qui sopra decide come viene letto."
"A DS card gives one of the item." = "Una carta DS dà uno di quello strumento."
"A Gen 5 card holds IVs but no EVs; the game works out the stats." = "Una carta della 5ª generazione contiene gli IV ma non gli EV; il gioco calcola le statistiche."
"A Pokemon Egg for you!" = "Un Uovo di Pokémon per te!"
"A Pokemon traded from that trainer, as most official events give." = "Un Pokémon ricevuto in scambio da quell'Allenatore, come dà la maggior parte degli eventi ufficiali."
"A Virtual Console queue is all .pk1 or all .pk2: they trade in different rooms" = "Una coda della Virtual Console è tutta .pk1 o tutta .pk2: si scambiano in stanze diverse"
"A card cannot hold stats: the game works them out from the species, level, nature, IVs and EVs. Set those here; Preview shows the stats the game will give it." = "Una carta non può contenere statistiche: il gioco le calcola da specie, livello, natura, IV ed EV. Impostali qui; l'anteprima mostra le statistiche che il gioco gli darà."
"A plugin runs as Python inside PokeUDS with full access to your files, console keys, the network and the radio. Install only plugins you trust; PokeUDS does not review them. The install screen says what the code does, and guardrails stop it deleting files outside its own folders, but they are not a sandbox." = "Un plugin gira come Python dentro PokeUDS con accesso completo ai tuoi file, alle chiavi della console, alla rete e alla radio. Installa solo plugin di cui ti fidi; PokeUDS non li controlla. La schermata di installazione dice cosa fa il codice, e delle protezioni gli impediscono di cancellare file fuori dalle sue cartelle, ma non sono una sandbox."
"A source is a published list of plugins (a pokeuds-source.json). Follow one by its GitHub OWNER/REPO or an https:// address; Browse lists what it offers." = "Una fonte è un elenco pubblicato di plugin (un pokeuds-source.json). Seguine una con il suo OWNER/REPO di GitHub o un indirizzo https://; Sfoglia elenca cosa offre."
