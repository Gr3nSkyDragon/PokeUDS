"A .pcd or .wc4 (856 bytes, the Gen 4 card; a .wc4 may keep its Pokemon unencrypted), or a .myg (936 bytes: the gift file the DS beacons carry)." = "Eine .pcd oder .wc4 (856 Bytes, die Karte der 4. Generation; eine .wc4 kann ihr Pokémon unverschlüsselt enthalten) oder eine .myg (936 Bytes: die Geschenkdatei, die die DS-Beacons tragen)."
"A .pgf (204 bytes, the Gen 5 card), or a .bin or .wc5full (720 bytes, the same file under two names: the gift file the DS beacons carry). Its received date and checksum are put right before it is sent." = "Eine .pgf (204 Bytes, die Karte der 5. Generation) oder eine .bin bzw. .wc5full (720 Bytes, dieselbe Datei unter zwei Namen: die Geschenkdatei, die die DS-Beacons tragen). Empfangsdatum und Prüfsumme werden direkt vor dem Senden korrigiert."
"A .pk8 copy for Sword and Shield, made as {value0} would move it, with its origin mark. This .{value1} stays in the bank as it is." = "Eine .pk8-Kopie für Sword und Shield, so gemacht, wie {value0} es übertragen würde, mit seinem Herkunftssymbol. Diese .{value1} bleibt unverändert in der Bank."
"A .pk{value0} copy made as {value1} makes it. This .{value2} stays in the bank as it is; the copy can never come back to Generation {value3}." = "Eine .pk{value0}-Kopie, so erstellt, wie {value1} es tut. Diese .{value2} bleibt unverändert in der Bank; die Kopie kann nie in die {value3}. Generation zurück."
"A .wc{value0} (264 bytes, as PKHeX and the event galleries keep them) or a .wc{value1}full (784 bytes: the distribution header, then the card). The game above decides how it is read." = "Eine .wc{value0} (264 Bytes, wie PKHeX und die Event-Galerien sie speichern) oder eine .wc{value1}full (784 Bytes: der Verteilungs-Header, dann die Karte). Das Spiel oben bestimmt, wie sie gelesen wird."
"A DS card gives one of the item." = "Eine DS-Karte gibt eines dieses Items."
"A Gen 5 card holds IVs but no EVs; the game works out the stats." = "Eine Karte der 5. Generation enthält IVs, aber keine EVs; das Spiel berechnet die Werte."
"A Pokemon Egg for you!" = "Ein Pokémon-Ei für dich!"
"A Pokemon traded from that trainer, as most official events give." = "Ein Pokémon, das von diesem Trainer getauscht wurde, wie bei den meisten offiziellen Events."
"A Virtual Console queue is all .pk1 or all .pk2: they trade in different rooms" = "Eine Virtual-Console-Warteschlange enthält nur .pk1 oder nur .pk2: Sie werden in verschiedenen Räumen getauscht"
"A card cannot hold stats: the game works them out from the species, level, nature, IVs and EVs. Set those here; Preview shows the stats the game will give it." = "Eine Karte kann keine Statuswerte enthalten: Das Spiel berechnet sie aus Art, Level, Wesen, IVs und EVs. Stell diese hier ein; die Vorschau zeigt die Werte, die das Spiel vergeben wird."
"A plugin runs as Python inside PokeUDS with full access to your files, console keys, the network and the radio. Install only plugins you trust; PokeUDS does not review them. The install screen says what the code does, and guardrails stop it deleting files outside its own folders, but they are not a sandbox." = "Ein Plugin läuft als Python in PokeUDS mit vollem Zugriff auf deine Dateien, die Konsolenschlüssel, das Netzwerk und das Funkgerät. Installiere nur Plugins, denen du vertraust; PokeUDS prüft sie nicht. Der Installationsbildschirm sagt, was der Code tut, und Schutzmaßnahmen verhindern, dass es Dateien außerhalb seiner eigenen Ordner löscht, aber das ist keine Sandbox."
"A source is a published list of plugins (a pokeuds-source.json). Follow one by its GitHub OWNER/REPO or an https:// address; Browse lists what it offers." = "Eine Quelle ist eine veröffentlichte Plugin-Liste (eine pokeuds-source.json). Folge einer über ihr GitHub-OWNER/REPO oder eine https://-Adresse; Durchsuchen listet, was sie anbietet."
