"PokeUDS sends this card the way a store distribution did, in DS beacons on channel 7. On the DS: Mystery Gift, Receive Gift, then the wireless option (not Wi-Fi). Choose the cartridge's language: the game ignores a gift for another. Any number of DS consoles can take it while it runs." = "PokeUDS sendet diese Karte so, wie es eine Verteilung im Laden tat, in DS-Beacons auf Kanal 7. Auf dem DS: Geheimgeschenk, Geschenk empfangen, dann die drahtlose Option (nicht Wi-Fi). Wähle die Sprache des Moduls: Das Spiel ignoriert ein Geschenk für eine andere. Beliebig viele DS-Konsolen können es empfangen, solange es läuft."
"PokeUDS sends this card the way a store or event distribution did. On the 3DS: Mystery Gift, Receive Gift, Get via Local Wireless. Any number of consoles can take it while it runs." = "PokeUDS sendet diese Karte so, wie es eine Verteilung im Laden oder bei einem Event tat. Auf dem 3DS: Geheimgeschenk, Geschenk empfangen, Per lokaler Kommunikation empfangen. Beliebig viele Konsolen können es empfangen, solange es läuft."
"PokeUDS signs the compressed message with the distributor's OPSSR key, as the real distributor does, so the game recovers and accepts it (docs/mystery_gift.md)." = "PokeUDS signiert die komprimierte Nachricht mit dem OPSSR-Schlüssel des Verteilers, wie es der echte Verteiler tut, sodass das Spiel sie wiederherstellt und annimmt (docs/mystery_gift.md)."
