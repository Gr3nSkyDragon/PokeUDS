"The Bank page: every Pokemon the app keeps, what the trades received included.\n\nReceived Pokemon are deposited from the output folder each time the page opens. A record can be\noffered in a trade, checked by PKHeX, copied through the Time Capsule (Gen 1 <-> Gen 2), exported or\ndeleted; Import adds files from anywhere.\n" = "The Bank page: every Pokemon the app keeps, what the trades received included.\n\nReceived Pokemon are deposited from the output folder each time the page opens. A record can be\noffered in a trade, checked by PKHeX, copied through the Time Capsule (Gen 1 <-> Gen 2), exported or\ndeleted; Import adds files from anywhere.\n"
"The Board page: ESP32 boards (the ESP32-S3 today), the esp32-uds-bridge firmware they run, and installing it.\n\nModelled on pokeldn's Boards page. Checks and installs are ``python -m pokeuds board ...`` children, like\nevery other run, so the page never holds a serial port the radio needs.\n" = "The Board page: ESP32 boards (the ESP32-S3 today), the esp32-uds-bridge firmware they run, and installing it.\n\nModelled on pokeldn's Boards page. Checks and installs are ``python -m pokeuds board ...`` children, like\nevery other run, so the page never holds a serial port the radio needs.\n"
"The Debug page (Settings, Debug tools): the demo radio, a network scan, capture analysis." = "The Debug page (Settings, Debug tools): the demo radio, a network scan, capture analysis."
"The Gifts page: Gen 6/7 Mystery Gift cards (docs/mystery_gift.md).\n\nThree ways in, one result panel:\n\n- Official events: the cards PKHeX.Core carries for the game, searchable.\n- Open a card: a .wc6/.wc7, or a 784-byte .wc6full/.wc7full distribution file.\n- Build your own: a custom card from a form, saved as a card file.\n\nA card's Pokemon is made as the Builder's trainer would receive it, checked by PKHeX, and can be kept in the\nbank and offered in a trade: the gift Pokemon by trade, until local distribution is understood. A custom\ncard's Pokemon matches no real event, so PKHeX flags it; the page says so.\n" = "The Gifts page: Gen 6/7 Mystery Gift cards (docs/mystery_gift.md).\n\nThree ways in, one result panel:\n\n- Official events: the cards PKHeX.Core carries for the game, searchable.\n- Open a card: a .wc6/.wc7, or a 784-byte .wc6full/.wc7full distribution file.\n- Build your own: a custom card from a form, saved as a card file.\n\nA card's Pokemon is made as the Builder's trainer would receive it, checked by PKHeX, and can be kept in the\nbank and offered in a trade: the gift Pokemon by trade, until local distribution is understood. A custom\ncard's Pokemon matches no real event, so PKHeX flags it; the page says so.\n"
