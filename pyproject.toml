[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeuds"
version = "0.1.0"
description = "Local wireless (UDS) trading with retail Nintendo 3DS Pokemon games through an ESP32-S3 or a USB Wi-Fi adapter (ldnd.exe)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycryptodome>=3.20",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pokeuds = "pokeuds.cli:main"

[tool.setuptools.packages.find]
include = ["pokeuds*"]

[tool.setuptools.package-data]
pokeuds = ["app/data/*.toml", "app/data/firmware/*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
