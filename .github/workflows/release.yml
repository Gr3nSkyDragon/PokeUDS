# A release of PokeUDS: the Windows app (PokeUDS-windows.zip) and the Mac app (PokeUDS-macos-arm64.zip for Apple
# Silicon, PokeUDS-macos-x64.zip for Intel), each carrying PKHeX inside, so players need nothing else; SHA256SUMS.
# Push a tag like v0.1.0 (push main first, or with it: git push --atomic origin main v0.1.0), or run it by hand from
# the Actions tab: with a tag name it makes that release, with none it only builds the apps, kept as the run's
# artifacts (a test build, no release). docs/release.md has the checklist.
# The release is created as a draft: publish it from the Releases page once the files are checked.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to create or add the files to (e.g. v0.2.0); empty: only build the apps"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  app:
    runs-on: windows-latest
    # actions: write lets the job delete the unsigned upload once SignPath has signed it (docs/code_signing.md).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4          # build_exe.py publishes the PKHeX helper to bundle it in the app
        with:
          dotnet-version: "10.0.x"
      - run: pip install -r requirements-gui.txt pyinstaller pytest
      - run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
      - run: python scripts/build_exe.py --no-zip
      # SignPath Foundation signs PokeUDS.exe and the PKHeX helper (.github/signpath/artifact-configuration.xml,
      # docs/code_signing.md). Without the SIGNPATH_API_TOKEN secret (a fork, or before SignPath is set up) the app
      # ships unsigned. The SIGNPATH_ORGANIZATION_ID variable is the SignPath organization; SIGNPATH_POLICY switches
      # from test-signing to release-signing.
      - name: Upload for signing
        id: unsigned
        if: env.SIGNPATH == 'true'
        env:
          SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeUDS-windows-unsigned
          path: dist/PokeUDS
          retention-days: 1
      - name: Sign
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pokeuds
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY || 'test-signing' }}
          artifact-configuration-slug: pokeuds-windows
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Replace with the signed files
        if: steps.unsigned.outcome == 'success'
        run: |
          Remove-Item -Recurse -Force dist/PokeUDS
          Move-Item signed dist/PokeUDS
          Get-AuthenticodeSignature dist/PokeUDS/PokeUDS.exe | Format-List Status, SignerCertificate
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.unsigned.outputs.artifact-id }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/build_exe.py --zip-only
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/PokeUDS-windows.zip

  app-macos:
    strategy:
      matrix:
        include:
          - os: macos-latest            # Apple Silicon: PokeUDS-macos-arm64.zip
            arch: arm64
          - os: macos-15-intel          # Intel Macs: PokeUDS-macos-x64.zip
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4          # build_exe.py publishes the PKHeX helper to bundle it in the app
        with:
          dotnet-version: "10.0.x"
      - run: pip install -r requirements-gui.txt pyinstaller
      - run: python scripts/build_exe.py
      - name: Check the app
        run: |
          APP=dist/PokeUDS.app
          file "$APP/Contents/MacOS/PokeUDS"
          codesign --verify --deep --strict --verbose=2 "$APP"
          HELPER=$(find "$APP" -name pokeuds-pkhex -type f | head -1)
          echo "bundled helper: $HELPER"
          echo '{"cmd":"ping"}' | "$HELPER"
          "$APP/Contents/MacOS/PokeUDS" --cli --help >/dev/null && echo "the app's command line starts"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos-${{ matrix.arch }}
          path: dist/PokeUDS-macos-${{ matrix.arch }}.zip

  release:
    if: github.event_name == 'push' || inputs.tag != ''
    needs: [app, app-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: SHA256SUMS
        run: cd assets && sha256sum PokeUDS-*.zip > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The tag's own notes (or a title), then which file to download (docs/releases/downloads.md).
          if [ -f "src/docs/releases/$TAG.md" ]; then cp "src/docs/releases/$TAG.md" notes.md; else echo "PokeUDS $TAG" > notes.md; fi
          [ -f src/docs/releases/downloads.md ] && { echo; cat src/docs/releases/downloads.md; } >> notes.md
          NOTES=notes.md
          PRE=""; case "$TAG" in v0.*) PRE="--prerelease";; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PokeUDS $TAG" \
              --notes-file "$NOTES" --draft $PRE
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
