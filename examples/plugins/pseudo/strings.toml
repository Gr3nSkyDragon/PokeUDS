"The Plugins page (above Board): installed plugins, adding one from a file or a source, and the install screen.\n\nAs pokeldn's: a card per plugin turns it on and off, updates it from a file, shows its folder and removes it\n(optionally with its saved data); every install and update shows the risk screen first (docs/plugins.md).\n" = "[!Thé Plügîñš pàgé (àbõvé Bõàrd): îñštàlléd plügîñš, àddîñg õñé frõm à fîlé õr à šõürçé, àñd thé îñštàll šçrééñ.\n\nÀš põkéldñ'š: à çàrd pér plügîñ türñš ît õñ àñd õff, üpdàtéš ît frõm à fîlé, šhõwš îtš fõldér àñd rémõvéš ît\n(õptîõñàllý wîth îtš šàvéd dàtà); évérý îñštàll àñd üpdàté šhõwš thé rîšk šçrééñ fîršt (dõçš/plügîñš.md).\n!]"
"The PokeUDS app: ``python -m gui``.\n\n``POKEUDS_GUI_WEB=<port>`` serves it to a browser instead of opening a window (for screenshots);\n``POKEUDS_GUI_HOST`` chooses the address it listens on (default: this machine only).\n" = "[!Thé PõkéÜDŠ àpp: ``pýthõñ -m güî``.\n\n``PÕKÉÜDŠ_GÜÎ_WÉB=<põrt>`` šérvéš ît tõ à brõwšér îñštéàd õf õpéñîñg à wîñdõw (fõr šçrééñšhõtš);\n``PÕKÉÜDŠ_GÜÎ_HÕŠT`` çhõõšéš thé àddréšš ît lîštéñš õñ (défàült: thîš màçhîñé õñlý).\n!]"
