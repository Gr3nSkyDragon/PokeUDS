"The Bank page: every Pokemon the app keeps, what the trades received included.\n\nReceived Pokemon are deposited from the output folder each time the page opens. A record can be\noffered in a trade, checked by PKHeX, copied through the Time Capsule (Gen 1 <-> Gen 2), exported or\ndeleted; Import adds files from anywhere.\n" = "[!Thé Bàñk pàgé: évérý Põkémõñ thé àpp kéépš, whàt thé tràdéš réçéîvéd îñçlüdéd.\n\nRéçéîvéd Põkémõñ àré dépõšîtéd frõm thé õütpüt fõldér éàçh tîmé thé pàgé õpéñš. À réçõrd çàñ bé\nõfféréd îñ à tràdé, çhéçkéd bý PKHéX, çõpîéd thrõügh thé Tîmé Çàpšülé (Géñ 1 <-> Géñ 2), éxpõrtéd õr\ndélétéd; Împõrt àddš fîléš frõm àñýwhéré.\n!]"
"The Board page: ESP32 boards (the ESP32-S3 today), the esp32-uds-bridge firmware they run, and installing it.\n\nModelled on pokeldn's Boards page. Checks and installs are ``python -m pokeuds board ...`` children, like\nevery other run, so the page never holds a serial port the radio needs.\n" = "[!Thé Bõàrd pàgé: ÉŠP32 bõàrdš (thé ÉŠP32-Š3 tõdàý), thé éšp32-üdš-brîdgé fîrmwàré théý rüñ, àñd îñštàllîñg ît.\n\nMõdélléd õñ põkéldñ'š Bõàrdš pàgé. Çhéçkš àñd îñštàllš àré ``pýthõñ -m põkéüdš bõàrd ...`` çhîldréñ, lîké\névérý õthér rüñ, šõ thé pàgé ñévér hõldš à šérîàl põrt thé ràdîõ ñéédš.\n!]"
"The Debug page (Settings, Debug tools): the demo radio, a network scan, capture analysis." = "[!Thé Débüg pàgé (Šéttîñgš, Débüg tõõlš): thé démõ ràdîõ, à ñétwõrk šçàñ, çàptüré àñàlýšîš.!]"
"The Gifts page: Gen 6/7 Mystery Gift cards (docs/mystery_gift.md).\n\nThree ways in, one result panel:\n\n- Official events: the cards PKHeX.Core carries for the game, searchable.\n- Open a card: a .wc6/.wc7, or a 784-byte .wc6full/.wc7full distribution file.\n- Build your own: a custom card from a form, saved as a card file.\n\nA card's Pokemon is made as the Builder's trainer would receive it, checked by PKHeX, and can be kept in the\nbank and offered in a trade: the gift Pokemon by trade, until local distribution is understood. A custom\ncard's Pokemon matches no real event, so PKHeX flags it; the page says so.\n" = "[!Thé Gîftš pàgé: Géñ 6/7 Mýštérý Gîft çàrdš (dõçš/mýštérý_gîft.md).\n\nThréé wàýš îñ, õñé réšült pàñél:\n\n- Õffîçîàl évéñtš: thé çàrdš PKHéX.Çõré çàrrîéš fõr thé gàmé, šéàrçhàblé.\n- Õpéñ à çàrd: à .wç6/.wç7, õr à 784-býté .wç6füll/.wç7füll dîštrîbütîõñ fîlé.\n- Büîld ýõür õwñ: à çüštõm çàrd frõm à fõrm, šàvéd àš à çàrd fîlé.\n\nÀ çàrd'š Põkémõñ îš màdé àš thé Büîldér'š tràîñér wõüld réçéîvé ît, çhéçkéd bý PKHéX, àñd çàñ bé képt îñ thé\nbàñk àñd õfféréd îñ à tràdé: thé gîft Põkémõñ bý tràdé, üñtîl lõçàl dîštrîbütîõñ îš üñdérštõõd. À çüštõm\nçàrd'š Põkémõñ màtçhéš ñõ réàl évéñt, šõ PKHéX flàgš ît; thé pàgé šàýš šõ.\n!]"
