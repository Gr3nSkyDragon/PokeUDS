# Official Pokemon terms for scripts/translate_strings.py: English as the app writes it, then the term the games use
# in each built-in language (pokeuds/app/data/lang/languages.toml). Only terms whose official wording is certain are
# here; a language left out of a term lets the model use the games' wording. Add a term, or fix one, and the next run
# uses it for the strings it translates (strings already translated stay as they are: fix those in lang/<locale>.toml).

